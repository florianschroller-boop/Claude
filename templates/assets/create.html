{% extends 'base.html' %}
{% block title %}Neues Asset{% endblock %}
{% block content %}

<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('asset_list') }}">Assets</a></li>
    <li class="breadcrumb-item active">Neues Asset</li>
  </ol>
</nav>

<div class="row justify-content-center">
  <div class="col-lg-10">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-bold"><i class="bi bi-plus-circle me-2 text-primary"></i>Neues Asset erstellen</h5>
      </div>
      <div class="card-body p-4">
        <form method="post">
          <!-- Basic info -->
          <h6 class="fw-bold text-muted text-uppercase small mb-3">Grundinformationen</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control" required id="asset-name"
                     placeholder="z.B. ThinkPad X1 Carbon">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Asset-Tag</label>
              <input type="text" name="asset_tag" class="form-control" id="asset-tag"
                     placeholder="z.B. IT-001">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Typ</label>
              <select name="asset_type" class="form-select">
                <option value="hardware">Hardware</option>
                <option value="software">Software</option>
                <option value="license">Lizenz</option>
                <option value="network">Netzwerk</option>
                <option value="other">Sonstiges</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Hersteller</label>
              <input type="text" name="manufacturer" class="form-control" placeholder="z.B. Lenovo">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Modell</label>
              <input type="text" name="model" class="form-control" placeholder="z.B. X1 Carbon Gen 11">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Seriennummer</label>
              <input type="text" name="serial_number" class="form-control font-monospace" placeholder="SN-XXXXX">
            </div>
          </div>

          <hr>
          <h6 class="fw-bold text-muted text-uppercase small mb-3">Zuweisung & Status</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Status</label>
              <select name="status" class="form-select">
                <option value="active" selected>Aktiv</option>
                <option value="inactive">Inaktiv</option>
                <option value="maintenance">Wartung</option>
                <option value="retired">Ausgemustert</option>
                <option value="lost">Verloren</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Zugewiesen an</label>
              <select name="assigned_to_id" class="form-select">
                <option value="">— Niemanden —</option>
                {% for user in users %}
                <option value="{{ user.id }}">{{ user.display_name }} ({{ user.username }})</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Abteilung</label>
              <input type="text" name="department" class="form-control" placeholder="z.B. IT">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Standort</label>
              <input type="text" name="location" class="form-control" placeholder="z.B. Büro 1.01">
            </div>
          </div>

          <hr>
          <h6 class="fw-bold text-muted text-uppercase small mb-3">Einkauf & Garantie</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Kaufdatum</label>
              <input type="date" name="purchase_date" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Kaufpreis (€)</label>
              <div class="input-group">
                <span class="input-group-text">€</span>
                <input type="text" name="purchase_price" class="form-control" placeholder="0,00">
              </div>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Garantie bis</label>
              <input type="date" name="warranty_until" class="form-control">
            </div>
          </div>

          <hr>
          <h6 class="fw-bold text-muted text-uppercase small mb-3">Netzwerk / System</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label fw-semibold">IP-Adresse</label>
              <input type="text" name="ip_address" class="form-control font-monospace" placeholder="192.168.1.x">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">MAC-Adresse</label>
              <input type="text" name="mac_address" class="form-control font-monospace" placeholder="AA:BB:CC:DD:EE:FF">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Betriebssystem</label>
              <input type="text" name="os_version" class="form-control" placeholder="Windows 11 Pro">
            </div>
          </div>

          <hr>
          <div class="mb-4">
            <label class="form-label fw-semibold">Notizen</label>
            <textarea name="notes" class="form-control" rows="4" placeholder="Weitere Informationen…"></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-save me-1"></i>Asset erstellen
            </button>
            <a href="{{ url_for('asset_list') }}" class="btn btn-outline-secondary">Abbrechen</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
