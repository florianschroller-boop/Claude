{% extends 'base.html' %}
{% block title %}{{ asset.name }} bearbeiten{% endblock %}
{% block content %}

<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('asset_list') }}">Assets</a></li>
    <li class="breadcrumb-item"><a href="{{ url_for('asset_detail', asset_id=asset.id) }}">{{ asset.name }}</a></li>
    <li class="breadcrumb-item active">Bearbeiten</li>
  </ol>
</nav>

<div class="row justify-content-center">
  <div class="col-lg-10">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-bold"><i class="bi bi-pencil me-2 text-warning"></i>{{ asset.name }} bearbeiten</h5>
      </div>
      <div class="card-body p-4">
        <form method="post">
          <h6 class="fw-bold text-muted text-uppercase small mb-3">Grundinformationen</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control" required value="{{ asset.name }}">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Asset-Tag</label>
              <input type="text" name="asset_tag" class="form-control" value="{{ asset.asset_tag or '' }}">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Typ</label>
              <select name="asset_type" class="form-select">
                {% for val, label in [('hardware','Hardware'),('software','Software'),('license','Lizenz'),('network','Netzwerk'),('other','Sonstiges')] %}
                <option value="{{ val }}" {% if asset.asset_type==val %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Hersteller</label>
              <input type="text" name="manufacturer" class="form-control" value="{{ asset.manufacturer or '' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Modell</label>
              <input type="text" name="model" class="form-control" value="{{ asset.model or '' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Seriennummer</label>
              <input type="text" name="serial_number" class="form-control font-monospace" value="{{ asset.serial_number or '' }}">
            </div>
          </div>
          <hr>
          <h6 class="fw-bold text-muted text-uppercase small mb-3">Zuweisung & Status</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Status</label>
              <select name="status" class="form-select">
                {% for val, label in [('active','Aktiv'),('inactive','Inaktiv'),('maintenance','Wartung'),('retired','Ausgemustert'),('lost','Verloren')] %}
                <option value="{{ val }}" {% if asset.status==val %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Zugewiesen an</label>
              <select name="assigned_to_id" class="form-select">
                <option value="">— Niemanden —</option>
                {% for user in users %}
                <option value="{{ user.id }}" {% if asset.assigned_to_id==user.id %}selected{% endif %}>
                  {{ user.display_name }}
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Abteilung</label>
              <input type="text" name="department" class="form-control" value="{{ asset.department or '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Standort</label>
              <input type="text" name="location" class="form-control" value="{{ asset.location or '' }}">
            </div>
          </div>
          <hr>
          <h6 class="fw-bold text-muted text-uppercase small mb-3">Einkauf & Garantie</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Kaufdatum</label>
              <input type="date" name="purchase_date" class="form-control"
                     value="{{ asset.purchase_date.strftime('%Y-%m-%d') if asset.purchase_date else '' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Kaufpreis (€)</label>
              <div class="input-group">
                <span class="input-group-text">€</span>
                <input type="text" name="purchase_price" class="form-control"
                       value="{{ '%.2f'|format(asset.purchase_price) if asset.purchase_price else '' }}">
              </div>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Garantie bis</label>
              <input type="date" name="warranty_until" class="form-control"
                     value="{{ asset.warranty_until.strftime('%Y-%m-%d') if asset.warranty_until else '' }}">
            </div>
          </div>
          <hr>
          <h6 class="fw-bold text-muted text-uppercase small mb-3">Netzwerk / System</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label fw-semibold">IP-Adresse</label>
              <input type="text" name="ip_address" class="form-control font-monospace" value="{{ asset.ip_address or '' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">MAC-Adresse</label>
              <input type="text" name="mac_address" class="form-control font-monospace" value="{{ asset.mac_address or '' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Betriebssystem</label>
              <input type="text" name="os_version" class="form-control" value="{{ asset.os_version or '' }}">
            </div>
          </div>
          <hr>
          <div class="mb-4">
            <label class="form-label fw-semibold">Notizen</label>
            <textarea name="notes" class="form-control" rows="4">{{ asset.notes or '' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-save me-1"></i>Speichern
            </button>
            <a href="{{ url_for('asset_detail', asset_id=asset.id) }}" class="btn btn-outline-secondary">Abbrechen</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
