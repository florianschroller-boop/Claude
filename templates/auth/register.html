{% extends 'base.html' %}
{% block title %}Registrieren{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-person-plus text-primary" style="font-size:3rem"></i>
      <h1 class="h3 mt-2 fw-bold">Konto erstellen</h1>
      <p class="text-muted small">Erstelle dein HelpDesk-Konto</p>
    </div>
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Vollständiger Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="Max Mustermann">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Benutzername <span class="text-danger">*</span></label>
        <input type="text" name="username" class="form-control" required placeholder="max.mustermann">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">E-Mail <span class="text-danger">*</span></label>
        <input type="email" name="email" class="form-control" required placeholder="max@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Passwort <span class="text-danger">*</span></label>
        <input type="password" name="password" class="form-control" required minlength="6"
               placeholder="Mindestens 6 Zeichen">
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-person-check me-1"></i> Registrieren
      </button>
      <div class="text-center mt-3">
        <a href="{{ url_for('login') }}" class="text-muted small">Bereits registriert? Anmelden</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
